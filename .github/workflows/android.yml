name: Android CI

on:
  push:
    branches: [ "master" ]
    tags: [ v* ]
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Checkout XposedKit repo
      uses: actions/checkout@v4
      with:
        repository: XposedKit/XposedKit
        path: xposedkit

    - name: Publish XposedKit to local maven repository
      run: |
        cd xposedkit
        chmod +x gradlew
        ./gradlew publishToMavenLocal

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

    - name: Prepare artifact
      id: prepare_artifact
      run: |
        cd ./app/build/outputs
        output_dir="$RUNNER_TEMP/artifacts"
        mkdir -p "$output_dir"
        cp -r ./mapping "$output_dir"
        find ./apk -type f -name "*.apk" -exec sudo cp {} "$output_dir" \;
        echo "output=$output_dir" >> $GITHUB_OUTPUT
        echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.event.repository.name }}-${{ steps.prepare_artifact.outputs.short_sha }}
        path: ${{ steps.prepare_artifact.outputs.output }}